name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop_app.py'
      - 'gorzdrav_hunter/**'
      - 'tests/**'
      - 'packaging/**'
      - 'requirements*.txt'
      - 'ca/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: Windows-x64
          - runner: macos-15
            name: macOS-arm64
          - runner: macos-15-intel
            name: macOS-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
        env:
          GORZDRAV_QT_PREVIEW: ${{ runner.temp }}/gorzdrav-interface.png
      - run: python packaging/build_desktop.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: GorzdravSlotHunter-${{ matrix.name }}
          path: |
            dist/*.zip
            ${{ runner.temp }}/gorzdrav-interface.png
          if-no-files-found: error
